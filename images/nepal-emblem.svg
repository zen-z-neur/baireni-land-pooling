<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="80" height="80">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="60%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#1e5799"/>
    </radialGradient>
    <linearGradient id="flagRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc143c"/>
      <stop offset="100%" stop-color="#990024"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#f5b041"/>
      <stop offset="100%" stop-color="#b7950b"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58d68d"/>
      <stop offset="100%" stop-color="#239b56"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#196f3d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Wreath of Rhododendrons (Red circular garland) -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#dc143c" stroke-width="7" stroke-dasharray="10 3" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="90" fill="#ffffff" stroke="url(#gold)" stroke-width="2"/>

  <!-- Inner Crest Circle -->
  <clipPath id="crestCircle">
    <circle cx="100" cy="95" r="76"/>
  </clipPath>

  <g clip-path="url(#crestCircle)">
    <!-- Sky -->
    <rect x="20" y="15" width="160" height="160" fill="url(#skyGrad)"/>

    <!-- Snow-capped Himalayas (Everest & Annapurna range) -->
    <polygon points="30,110 65,55 90,95 105,65 135,105 160,75 185,120 20,120" fill="#ffffff"/>
    <polygon points="65,55 75,75 60,85 50,70" fill="#d4e6f1" opacity="0.7"/>
    <polygon points="105,65 115,85 100,90 92,80" fill="#d4e6f1" opacity="0.7"/>
    <polygon points="160,75 170,95 155,100" fill="#d4e6f1" opacity="0.7"/>

    <!-- Green Middle Hills (Pahad) -->
    <path d="M20,135 Q55,90 95,115 Q145,95 180,135 L180,180 L20,180 Z" fill="url(#hill1)"/>
    <path d="M20,145 Q60,115 110,130 Q150,115 180,148 L180,180 L20,180 Z" fill="url(#hill2)"/>

    <!-- Yellow Terai Plains & River Valley (Seti-Madi) -->
    <path d="M20,155 Q100,140 180,155 L180,180 L20,180 Z" fill="#f7dc6f"/>
    <!-- River -->
    <path d="M75,130 Q90,145 95,180" stroke="#3498db" stroke-width="6" fill="none" opacity="0.8"/>

    <!-- Two Hands Shaking (Symbol of Gender & Social Equality) -->
    <g transform="translate(68, 138) scale(0.65)">
      <rect x="15" y="10" width="30" height="14" rx="7" fill="#f5cba7"/>
      <rect x="55" y="10" width="30" height="14" rx="7" fill="#e59866"/>
      <path d="M35,17 Q50,7 65,17" stroke="#b03a2e" stroke-width="4" fill="none"/>
      <!-- Clasp -->
      <circle cx="50" cy="17" r="12" fill="#d35400" opacity="0.3"/>
    </g>
  </g>

  <!-- Nepal Flag at the top -->
  <g transform="translate(86, 6) scale(0.8)">
    <polygon points="10,0 28,14 14,14 30,30 10,30" fill="url(#flagRed)" stroke="#003893" stroke-width="2"/>
    <!-- White Moon & Sun -->
    <circle cx="16" cy="10" r="3" fill="#ffffff"/>
    <polygon points="17,21 19,23 21,21 21,24 23,24 22,26 24,27 22,28 23,30 20,29 19,31 18,29 15,30 16,28 14,27 16,26 15,24 17,24" fill="#ffffff" transform="scale(0.8) translate(3,3)"/>
  </g>

  <!-- Golden Ears of Paddy / Wheat circling -->
  <path d="M25,120 C18,70 45,35 80,24" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M175,120 C182,70 155,35 120,24" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Bottom Red Ribbon Banner -->
  <path d="M30,168 L170,168 L160,185 L100,182 L40,185 Z" fill="#b03a2e" filter="url(#shadow)"/>
  <text x="100" y="179" font-family="'Hind Siliguri', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">जननी जन्मभूमिश्च स्वर्गादपि गरीयसी</text>
</svg>
